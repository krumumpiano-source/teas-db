<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้าง SAR อัตโนมัติ - TEAS-DB</title>
  <script>
    window.API_BASE_URL = 'https://script.google.com/macros/s/AKfycbyPG_sgIAzE_KHrn50qsYFu0tHGRXPSJuquHSb7fpUFqPHpdIWjXYMb8NqdMhaDU7W1/exec';
    window.currentPage = 'sar';
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    button, .nav-btn, .btn { cursor: pointer; }
    body {
      font-family: 'Sarabun', 'Kanit', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .content { padding: 40px; }
    .form-section {
      background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.1);
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 1em;
    }
    .btn {
      padding: 16px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
    }
    .evidence-item {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📘 สร้าง SAR อัตโนมัติ</h1>
    </div>
    <div id="nav-container"></div>
    <div class="content">
      <div class="form-section">
        <h2>ข้อมูลทั่วไป</h2>
        <div class="form-group">
          <label>ปีการศึกษา</label>
          <input type="text" id="academicYear" value="2567" placeholder="เช่น 2567">
        </div>
        <div class="form-group">
          <label>ชื่อ-นามสกุล</label>
          <input type="text" id="teacherName" placeholder="ชื่อ-นามสกุล">
        </div>
        <div class="form-group">
          <label>ตำแหน่ง</label>
          <input type="text" id="position" value="ครู" placeholder="ตำแหน่ง">
        </div>
        <div class="form-group">
          <label>โรงเรียน</label>
          <input type="text" id="school" placeholder="ชื่อโรงเรียน">
        </div>
        <div class="form-group">
          <label>สำนักงานเขตพื้นที่การศึกษา</label>
          <input type="text" id="office" placeholder="สำนักงานเขตพื้นที่การศึกษา">
        </div>
      </div>
      
      <div class="form-section">
        <h2>หลักฐานที่ใช้</h2>
        <div id="evidenceList" class="evidence-list">
          <p>กำลังโหลดหลักฐาน...</p>
        </div>
      </div>
      
      <button class="btn" onclick="generateSAR()">📄 สร้าง SAR</button>
      <button class="btn" onclick="previewSAR()">👁️ ดูตัวอย่าง</button>
      
      <div id="preview" class="form-section" style="display: none;">
        <h2>ตัวอย่าง SAR</h2>
        <div id="previewContent"></div>
      </div>
    </div>
  </div>
  
  <script>
    var API_BASE_URL = window.API_BASE_URL;
    
    // Load navigation and common functions from common.html
    (function() {
      fetch('common.html')
        .then(response => response.text())
        .then(html => {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');
          
          // Extract and execute scripts from common.html
          var scripts = doc.querySelectorAll('script');
          scripts.forEach(function(script) {
            var newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.head.appendChild(newScript);
          });
          
          // Load navigation
          var nav = doc.querySelector('.nav');
          if (nav) {
            document.getElementById('nav-container').innerHTML = nav.outerHTML;
            setTimeout(function() {
              if (typeof setActiveMenu === 'function') {
                setActiveMenu();
              }
            }, 100);
          }
        })
        .catch(function(error) {
          console.error('Error loading common.html:', error);
        });
    })();
    
    async function loadSAREvidence() {
      var academicYear = document.getElementById('academicYear').value || '2567';
      var teacherInfo = {
        name: document.getElementById('teacherName').value,
        position: document.getElementById('position').value,
        school: document.getElementById('school').value,
        office: document.getElementById('office').value
      };
      
      var evidenceListDiv = document.getElementById('evidenceList');
      showLoading('evidenceList');
      
      try {
        var result = await apiCall('generateSAR', {
          academicYear: academicYear,
          teacherInfo: teacherInfo
        });
        
        if (result.success && result.sar && result.sar.evidence) {
          displayEvidenceList(result.sar.evidence);
        } else {
          evidenceListDiv.innerHTML = '<div style="text-align: center; color: #dc3545; padding: 20px;">ไม่พบหลักฐานสำหรับ SAR</div>';
        }
      } catch(error) {
        evidenceListDiv.innerHTML = '<div style="text-align: center; color: #dc3545; padding: 20px;">เกิดข้อผิดพลาด: ' + handleError(error, 'loadSAREvidence') + '</div>';
      }
    }
    
    function displayEvidenceList(evidence) {
      var evidenceListDiv = document.getElementById('evidenceList');
      if (!evidence || !Array.isArray(evidence)) {
        evidenceListDiv.innerHTML = '<p style="text-align: center; color: #666;">ข้อมูลหลักฐานไม่ถูกต้อง</p>';
        return;
      }
      
      var html = '<h3>พบ ' + evidence.length + ' หลักฐาน</h3>';
      
      if (evidence.length === 0) {
        html += '<p style="text-align: center; color: #666; padding: 20px;">ยังไม่มีหลักฐานสำหรับ SAR ในปีการศึกษานี้</p>';
      } else {
        var categories = {
          plans: [],
          reports: [],
          photos: [],
          training: [],
          assessments: [],
          orders: [],
          innovations: []
        };
        
        evidence.forEach(function(item) {
          var type = item.evidence_type || '';
          if (type.indexOf('plan') !== -1) categories.plans.push(item);
          else if (type.indexOf('report') !== -1) categories.reports.push(item);
          else if (type.indexOf('photo') !== -1) categories.photos.push(item);
          else if (type.indexOf('training') !== -1) categories.training.push(item);
          else if (type.indexOf('assessment') !== -1) categories.assessments.push(item);
          else if (type.indexOf('order') !== -1) categories.orders.push(item);
          else if (type.indexOf('innovation') !== -1) categories.innovations.push(item);
        });
        
        html += '<div class="evidence-item"><strong>แผนการจัดการเรียนรู้:</strong> ' + categories.plans.length + ' ชิ้น</div>';
        html += '<div class="evidence-item"><strong>รายงาน:</strong> ' + categories.reports.length + ' ชิ้น</div>';
        html += '<div class="evidence-item"><strong>รูปภาพ:</strong> ' + categories.photos.length + ' ชิ้น</div>';
        html += '<div class="evidence-item"><strong>การอบรม:</strong> ' + categories.training.length + ' ชิ้น</div>';
        html += '<div class="evidence-item"><strong>การประเมิน:</strong> ' + categories.assessments.length + ' ชิ้น</div>';
        html += '<div class="evidence-item"><strong>คำสั่ง:</strong> ' + categories.orders.length + ' ชิ้น</div>';
        html += '<div class="evidence-item"><strong>นวัตกรรม:</strong> ' + categories.innovations.length + ' ชิ้น</div>';
      }
      
      evidenceListDiv.innerHTML = html;
    }
    
    async function generateSAR() {
      var academicYear = document.getElementById('academicYear').value;
      var teacherName = document.getElementById('teacherName').value;
      var position = document.getElementById('position').value;
      var school = document.getElementById('school').value;
      var office = document.getElementById('office').value;
      
      if (!academicYear) {
        alert('กรุณากรอกปีการศึกษา');
        return;
      }
      
      var teacherInfo = {
        name: teacherName,
        position: position,
        school: school,
        office: office
      };
      
      if (confirm('กำลังสร้าง SAR PDF...\n\nคลิก OK เพื่อดำเนินการต่อ')) {
        try {
          var result = await apiCall('generateAndExportSAR', {
            academicYear: academicYear,
            teacherInfo: teacherInfo
          });
          
          if (result.success && result.file_url) {
            alert('สร้าง SAR PDF สำเร็จ!\n\nไฟล์: ' + result.file_name + '\n\nคลิก OK เพื่อเปิดไฟล์');
            window.open(result.file_url, '_blank');
            previewSAR();
          } else {
            alert('เกิดข้อผิดพลาด: ' + (result.message || 'ไม่สามารถสร้างไฟล์ได้'));
          }
        } catch(error) {
          alert('เกิดข้อผิดพลาด: ' + handleError(error, 'generateSAR'));
        }
      }
    }
    
    function previewSAR() {
      var academicYear = document.getElementById('academicYear').value;
      var teacherName = document.getElementById('teacherName').value || 'ชื่อครู';
      var position = document.getElementById('position').value || 'ครู';
      var school = document.getElementById('school').value || 'โรงเรียน';
      var office = document.getElementById('office').value || 'สำนักงานเขตพื้นที่การศึกษา';
      
      var html = '<h2>รายงานการประเมินตนเองรายบุคคล</h2>';
      html += '<p>ปีการศึกษา ' + academicYear + '</p>';
      html += '<p><strong>ชื่อ:</strong> ' + teacherName + '</p>';
      html += '<p><strong>ตำแหน่ง:</strong> ' + position + '</p>';
      html += '<p><strong>โรงเรียน:</strong> ' + school + '</p>';
      html += '<p><strong>สังกัด:</strong> ' + office + '</p>';
      html += '<hr>';
      html += '<p>รายงานนี้สร้างโดยระบบ TEAS-DB อัตโนมัติ</p>';
      
      document.getElementById('previewContent').innerHTML = html;
      document.getElementById('preview').style.display = 'block';
    }
    
    document.getElementById('academicYear').addEventListener('change', loadSAREvidence);
    
    function initPage() {
      loadSAREvidence();
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
