<style>
/* ===== Navigation Only (Safe) ===== */
.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 12px 20px;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
}

.nav-btn {
  text-decoration: none;
  color: #333;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background 0.2s, color 0.2s;
}

.nav-btn:hover {
  background: #e9ecef;
}

.nav-btn.active {
  background: #667eea;
  color: #fff;
  font-weight: 700;
}
</style>

<script>
/* =========================
   Global API Helper
========================= */

// API Base URL (must be set in each page)
var API_BASE_URL = window.API_BASE_URL || '';

/**
 * API Call Helper
 */
async function apiCall(action, data) {
  var baseUrl = window.API_BASE_URL || API_BASE_URL;
  if (!baseUrl) {
    throw new Error('API_BASE_URL is not defined');
  }

  const res = await fetch(baseUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...data })
  });

  if (!res.ok) {
    throw new Error('HTTP ' + res.status);
  }

  return await res.json();
}

/* =========================
   Menu Active State
========================= */

function setActiveMenu() {
  try {
    const current = window.currentPage || 'index';
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.dataset.page === current) {
        btn.classList.add('active');
      }
    });
  } catch (e) {
    console.warn('setActiveMenu failed', e);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setActiveMenu);
} else {
  setActiveMenu();
}

/* =========================
   Error Helper
========================= */
function handleError(err) {
  if (!err) return 'เกิดข้อผิดพลาด';
  if (typeof err === 'string') return err;
  if (err.message) return err.message;
  return 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ';
}
</script>
