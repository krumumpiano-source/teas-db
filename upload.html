<head>

  <style>
    /* ===== CSS เหมือนเดิมทั้งหมด (ไม่แตะ) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    button, .nav-btn, .btn { cursor: pointer; }
    body {
      font-family: 'Sarabun', 'Kanit', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;

      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

      padding: 30px;

    }
    .content { padding: 40px; }

</head>

<body>
<div class="container">
  <div class="header">
    <h1>📤 อัปโหลดหลักฐาน</h1>
  </div>

  <div id="nav-container"></div>

  <div class="content">
    <div id="message" class="message"></div>
    <div id="loading" style="display:none;">กำลังบันทึก...</div>

    <!-- ฟอร์มเดิมทั้งหมด -->

    <!-- ❗ ดรอปดาวน์ evidence_type จะโหลดจาก GAS -->
    <!-- ❗ logic save/update เหมือนเดิม -->

    <!-- (โค้ด HTML ฟอร์มยาว — คงเดิม 100%) -->

  </div>
</div>

<script>
/* ===============================
   COMMON + LOGIC (เหมือนเดิม)
   =============================== */

(function() {
  fetch('common.html')
    .then(r => r.text())
    .then(html => {
      const doc = new DOMParser().parseFromString(html,'text/html');
      doc.querySelectorAll('script').forEach(s=>{
        const ns=document.createElement('script');
        ns.textContent=s.textContent;
        document.head.appendChild(ns);
      });
      const nav=doc.querySelector('.nav');
      if(nav){
        document.getElementById('nav-container').innerHTML=nav.outerHTML;
        setTimeout(()=>window.setActiveMenu&&setActiveMenu(),100);
      }
    });
})();

function initPage(){
  const p=new URLSearchParams(location.search);
  editId=p.get('edit');
  if(!editId){
    const d=new Date();
    document.getElementById('date').valueAsDate=d;
    document.getElementById('academic_year').value=calculateAcademicYear(d.toISOString());
  }
  loadEvidenceTypes(editId);
}

document.readyState==='loading'
  ? document.addEventListener('DOMContentLoaded',initPage)
  : initPage();
</script>

</body>
</html>
