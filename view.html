<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดูหลักฐาน - TEAS-DB</title>
  <script>
    window.API_BASE_URL = 'https://script.google.com/macros/s/AKfycbyPG_sgIAzE_KHrn50qsYFu0tHGRXPSJuquHSb7fpUFqPHpdIWjXYMb8NqdMhaDU7W1/exec';
    window.currentPage = 'view';
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    button, .nav-btn, .btn { cursor: pointer; }
    body {
      font-family: 'Sarabun', 'Kanit', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .content { padding: 40px; }
    .evidence-card {
      background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.1);
      border: 2px solid #e9ecef;
    }
    .evidence-card h2 {
      color: #667eea;
      margin-bottom: 25px;
      font-size: 1.8em;
      font-weight: 700;
      padding-bottom: 15px;
      border-bottom: 3px solid #667eea;
    }
    .info-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 20px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e9ecef;
    }
    .info-label {
      font-weight: 600;
      color: #667eea;
      font-size: 1.05em;
    }
    .info-value { color: #333; font-size: 1.05em; }
    .award-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .badge {
      padding: 6px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
    }
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 20px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-danger {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
    }
    .btn-secondary {
      background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ดูหลักฐาน</h1>
    </div>
    <div id="nav-container"></div>
    <div class="content">
      <div id="loading"></div>
      <div id="evidence-detail" style="display: none;"></div>
    </div>
  </div>
  
  <script>
    var API_BASE_URL = window.API_BASE_URL;
    
    // Load navigation and common functions from common.html
    (function() {
      fetch('common.html')
        .then(response => response.text())
        .then(html => {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');
          
          // Extract and execute scripts from common.html
          var scripts = doc.querySelectorAll('script');
          scripts.forEach(function(script) {
            var newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.head.appendChild(newScript);
          });
          
          // Load navigation
          var nav = doc.querySelector('.nav');
          if (nav) {
            document.getElementById('nav-container').innerHTML = nav.outerHTML;
            setTimeout(function() {
              if (typeof setActiveMenu === 'function') {
                setActiveMenu();
              }
            }, 100);
          }
        })
        .catch(function(error) {
          console.error('Error loading common.html:', error);
        });
    })();
    
    async function loadEvidence(evidenceId) {
      if (!evidenceId) {
        showViewError('ไม่พบ ID ของหลักฐาน');
        return;
      }
      
      showLoading('loading');
      
      try {
        var result = await apiCall('getEvidenceById', {evidenceId: evidenceId});
        
        if (result.success && result.evidence) {
          hideLoading('loading');
          displayEvidence(result.evidence);
        } else {
          hideLoading('loading');
          showViewError(result.message || 'ไม่พบหลักฐาน');
        }
      } catch(error) {
        hideLoading('loading');
        showViewError('ไม่สามารถโหลดข้อมูลได้: ' + handleError(error, 'loadEvidence'));
      }
    }
    
    function displayEvidence(evidence) {
      var html = '<div class="evidence-card">';
      html += '<h2>' + (evidence.title || 'ไม่มีชื่อ') + '</h2>';
      html += '<div class="info-row"><div class="info-label">วันที่:</div><div class="info-value">' + (evidence.date || '-') + '</div></div>';
      html += '<div class="info-row"><div class="info-label">ประเภท:</div><div class="info-value">' + (evidence.evidence_type || '-') + '</div></div>';
      html += '<div class="info-row"><div class="info-label">ปีการศึกษา:</div><div class="info-value">' + (evidence.academic_year || '-') + '</div></div>';
      html += '<div class="info-row"><div class="info-label">คำอธิบาย:</div><div class="info-value">' + (evidence.description || '-') + '</div></div>';
      
      if (evidence.drive_link) {
        html += '<div class="info-row"><div class="info-label">ไฟล์หลัก:</div><div class="info-value"><a href="' + evidence.drive_link + '" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 600;">📎 เปิดไฟล์หลัก</a></div></div>';
      }
      
      if (evidence.additional_files) {
        try {
          var additionalFiles = typeof evidence.additional_files === 'string' ? JSON.parse(evidence.additional_files) : evidence.additional_files;
          if (additionalFiles && additionalFiles.length > 0) {
            html += '<div class="info-row"><div class="info-label">ไฟล์เพิ่มเติม:</div><div class="info-value">';
            html += '<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">';
            additionalFiles.forEach(function(file, index) {
              html += '<div style="padding: 10px; background: #f8f9ff; border-radius: 8px; border-left: 3px solid #667eea;">';
              html += '<a href="' + file.url + '" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 600;">📎 ' + (file.name || 'ไฟล์ ' + (index + 1)) + '</a>';
              if (file.size) {
                html += ' <span style="color: #666; font-size: 0.9em;">(' + formatFileSize(file.size) + ')</span>';
              }
              html += '</div>';
            });
            html += '</div></div></div>';
          }
        } catch(e) {
          console.error('Error parsing additional_files:', e);
        }
      }
      
      html += '<div class="info-row"><div class="info-label">ใช้สำหรับ:</div><div class="info-value">';
      html += '<div class="award-badges">';
      if (evidence.sar === 'TRUE' || evidence.sar === true) html += '<span class="badge">SAR</span>';
      if (evidence.pa_ks4 === 'TRUE' || evidence.pa_ks4 === true) html += '<span class="badge">คศ.4</span>';
      if (evidence.phet_mathayom === 'TRUE' || evidence.phet_mathayom === true) html += '<span class="badge">เพชรมัธยม</span>';
      if (evidence.khurusapha === 'TRUE' || evidence.khurusapha === true) html += '<span class="badge">คุรุสภา</span>';
      if (evidence.obec === 'TRUE' || evidence.obec === true) html += '<span class="badge">OBEC</span>';
      if (evidence.next_gen === 'TRUE' || evidence.next_gen === true) html += '<span class="badge">Next Gen</span>';
      html += '</div></div></div>';
      
      html += '<button class="btn btn-primary" onclick="editEvidence(\'' + evidence.evidence_id + '\')">✏️ แก้ไข</button>';
      html += '<button class="btn btn-danger" onclick="deleteEvidence(\'' + evidence.evidence_id + '\')">🗑️ ลบ</button>';
      html += '<button class="btn btn-secondary" onclick="window.history.back()">← กลับ</button>';
      html += '</div>';
      
      document.getElementById('evidence-detail').innerHTML = html;
      document.getElementById('evidence-detail').style.display = 'block';
    }
    
    function formatFileSize(bytes) {
      if (!bytes || bytes === 0) return '0 Bytes';
      var k = 1024;
      var sizes = ['Bytes', 'KB', 'MB', 'GB'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
    
    function editEvidence(id) {
      if (!id) {
        alert('ไม่พบ ID ของหลักฐาน');
        return;
      }
      window.location.href = 'upload.html?edit=' + encodeURIComponent(id);
    }
    
    async function deleteEvidence(id) {
      if (!id) {
        alert('ไม่พบ ID ของหลักฐาน');
        return;
      }
      
      if (confirm('คุณต้องการลบหลักฐานนี้หรือไม่?')) {
        try {
          var result = await apiCall('deleteEvidence', {evidenceId: id});
          
          if (result.success) {
            alert('ลบหลักฐานสำเร็จ');
            window.location.href = 'index.html';
          } else {
            alert('เกิดข้อผิดพลาด: ' + (result.message || 'ไม่สามารถลบได้'));
          }
        } catch(error) {
          alert('เกิดข้อผิดพลาด: ' + handleError(error, 'deleteEvidence'));
        }
      }
    }
    
    function showViewError(message) {
      var loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.innerHTML = '<div style="text-align: center; color: #dc3545; padding: 40px; background: #fee; border: 2px solid #fcc; border-radius: 10px;"><strong>⚠️ เกิดข้อผิดพลาด</strong><br>' + message + '<br><br><a href="index.html" class="btn">← กลับหน้าหลัก</a></div>';
      }
    }
    
    function initPage() {
      var urlParams = new URLSearchParams(window.location.search);
      var evidenceId = urlParams.get('id');
      
      if (!evidenceId) {
        showViewError('ไม่พบ ID ของหลักฐาน');
        return;
      }
      
      loadEvidence(evidenceId);
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
